# Publica @rendra-ui/app no npm quando uma tag v* é empurrada (ex.: v1.1.0). A tag precisa
# bater com "version" do package.json, checado abaixo antes de publicar. Nada é publicado sem
# uma tag: só o autor cria a tag, depois do CI verde e da revisão da entrega.
#
# A publicação usa o trusted publishing do npm (o pacote tem este repositório e este workflow
# cadastrados como "Trusted Publisher"): não há segredo NPM_TOKEN nem NODE_AUTH_TOKEN; o
# id-token do GitHub autentica e assina o atestado de proveniência (padrão dos produtos
# Rendra, o mesmo do Rendra web).
name: Publicar pacote (npm)

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    # Guarda de repositório (achado B15 do Opus): o workflow só roda no repositório oficial,
    # nunca num fork, mesmo que alguém empurre uma tag v* lá.
    if: github.repository == 'bsmagalhaes/rendra-ui-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Achado M4 do veredito da entrega dos Blocos 3 e 4 (Fable): barato, roda logo depois do
      # checkout, antes de gastar minutos com npm ci/build:lib/verify:pack. Lê a version direto
      # do package.json (grep/sed), sem depender do Node já configurado (setup-node vem só
      # depois).
      - name: Tag bate com a version do package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG não bate com a version $PKG do package.json." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # O trusted publishing exige npm 11.5.1 ou mais recente. O Node 24 do runner costuma
      # trazer uma 11.x recente, mas nem toda 24.x: se vier menor, atualiza; sempre imprime a
      # versão usada, para o log da publicação provar qual npm assinou.
      - name: npm com suporte a trusted publishing (11.5.1 ou mais recente)
        run: |
          NPM_ATUAL="$(npm --version)"
          MENOR="$(printf '%s\n%s\n' 11.5.1 "$NPM_ATUAL" | sort -V | head -n1)"
          if [ "$MENOR" != "11.5.1" ]; then
            echo "npm $NPM_ATUAL é anterior à 11.5.1; atualizando."
            npm install -g npm@^11.5.1
          fi
          echo "npm em uso: $(npm --version)"
      - run: npm ci
      # Achado M4: os mesmos portões do ci.yml, para uma tag empurrada sobre um commit fora de
      # main (que não passa pelo job "verify" do ci.yml) não publicar sem eles.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:rules
      - run: npm run test:coverage
      - run: npm run build:lib
      - run: npm run verify:pack -- --publicacao
      # Trusted publishing: sem NODE_AUTH_TOKEN. O npm troca o id-token do GitHub por uma
      # credencial de publicação de curta duração e grava a proveniência.
      - name: Publicar pelo trusted publishing
        run: npm publish --provenance --access public
